<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>VisCurator · Live System Demo</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#060610;--s1:#0d0d1a;--s2:#13131f;--s3:#1a1a2e;
  --border:rgba(255,255,255,0.07);
  --v:#7c6fff;--v2:#5e4fff;--t:#4fc3f7;--g:#69f0ae;--o:#ffd740;--r:#ff5370;
  --text:#e8e8f4;--muted:#55556a;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif}

body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 70% 50% at 15% 5%,rgba(124,111,255,.09) 0%,transparent 60%),
    radial-gradient(ellipse 50% 40% at 85% 90%,rgba(79,195,247,.07) 0%,transparent 60%),
    radial-gradient(ellipse 40% 30% at 50% 50%,rgba(105,240,174,.03) 0%,transparent 60%)}

/* ── Layout ── */
.container{position:relative;z-index:1;width:100%;height:100%;display:flex;flex-direction:column}

/* ── Header ── */
.header{display:flex;align-items:center;justify-content:space-between;padding:16px 32px;
  border-bottom:1px solid var(--border);flex-shrink:0;backdrop-filter:blur(8px);background:rgba(6,6,16,.7)}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:34px;height:34px;border-radius:8px;
  background:linear-gradient(135deg,var(--v),var(--t));display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:800;color:#fff;box-shadow:0 0 20px rgba(124,111,255,.3)}
.logo-text{font-size:17px;font-weight:700;letter-spacing:-.5px}
.logo-text span{color:var(--v)}
.header-badge{background:rgba(124,111,255,.15);border:1px solid rgba(124,111,255,.3);color:var(--v);
  padding:5px 14px;border-radius:100px;font-size:11px;font-weight:600;letter-spacing:.5px;
  display:flex;align-items:center;gap:6px}
.pulse-dot{width:8px;height:8px;border-radius:50%;background:var(--g);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}

/* ── Progress ── */
#top-progress{position:fixed;top:0;left:0;height:3px;z-index:200;
  background:linear-gradient(90deg,var(--v),var(--t),var(--g));transition:width .5s ease;width:0%}

/* ── Main area ── */
.main{flex:1;display:flex;overflow:hidden}

/* ── Left panel: steps ── */
.steps-panel{width:280px;flex-shrink:0;border-right:1px solid var(--border);padding:20px 16px;
  overflow-y:auto;background:rgba(13,13,26,.4)}
.steps-title{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:16px}

.step{display:flex;gap:12px;padding:10px 12px;border-radius:10px;margin-bottom:6px;cursor:pointer;
  transition:all .2s;border:1px solid transparent}
.step:hover{background:rgba(124,111,255,.05);border-color:rgba(124,111,255,.15)}
.step.active{background:rgba(124,111,255,.08);border-color:rgba(124,111,255,.3)}
.step.completed .step-num{background:var(--g);color:#000}
.step.active .step-num{background:var(--v);color:#fff;box-shadow:0 0 12px rgba(124,111,255,.4)}
.step.running .step-num{background:var(--t);color:#000;animation:pulse 1s infinite}

.step-num{width:28px;height:28px;border-radius:8px;background:var(--s3);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;
  font-family:'JetBrains Mono';flex-shrink:0;transition:all .3s}
.step-info{flex:1;min-width:0}
.step-name{font-size:12px;font-weight:600;color:var(--text);margin-bottom:2px}
.step-desc{font-size:10px;color:var(--muted);line-height:1.4}
.step-time{font-size:10px;color:var(--muted);font-family:'JetBrains Mono';margin-top:3px}

/* ── Right content ── */
.content{flex:1;overflow-y:auto;padding:24px 32px}

/* ── Cards ── */
.card{background:var(--s2);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:16px;
  transition:border-color .2s,opacity .3s,transform .3s}
.card.glow-v{border-color:rgba(124,111,255,.3);box-shadow:0 0 30px rgba(124,111,255,.06)}
.card.glow-g{border-color:rgba(105,240,174,.3);box-shadow:0 0 30px rgba(105,240,174,.06)}
.card.glow-t{border-color:rgba(79,195,247,.3);box-shadow:0 0 30px rgba(79,195,247,.06)}
.card.glow-r{border-color:rgba(255,83,112,.3);box-shadow:0 0 30px rgba(255,83,112,.06)}
.card-label{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);
  margin-bottom:10px;display:flex;align-items:center;gap:6px}
.card-label::before{content:'';display:inline-block;width:3px;height:12px;border-radius:1px;
  background:linear-gradient(var(--v),var(--t))}

/* ── Terminal ── */
.terminal{background:#020208;border:1px solid rgba(124,111,255,.2);border-radius:10px;
  padding:14px 16px;font-family:'JetBrains Mono';font-size:11.5px;line-height:1.8;
  color:#7a8ba4;max-height:320px;overflow-y:auto;scroll-behavior:smooth}
.terminal::-webkit-scrollbar{width:4px}
.terminal::-webkit-scrollbar-thumb{background:var(--v);border-radius:4px}
.t-prompt{color:var(--v)}
.t-ok{color:var(--g);font-weight:600}
.t-err{color:var(--r)}
.t-info{color:var(--t)}
.t-dim{color:#3a4050}
.t-val{color:var(--o);font-weight:600}
.t-key{color:#c792ea}

/* ── JSON viewer ── */
.json-view{background:#020208;border:1px solid rgba(124,111,255,.15);border-radius:10px;
  padding:14px 16px;font-family:'JetBrains Mono';font-size:11px;line-height:1.7;color:#7a8ba4;
  max-height:260px;overflow-y:auto;white-space:pre-wrap;word-break:break-all}

/* ── Metric cards ── */
.metrics-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.metric-card{text-align:center;padding:14px 10px;background:var(--s3);border-radius:10px;border:1px solid var(--border)}
.metric-val{font-size:1.5rem;font-weight:900;font-family:'JetBrains Mono';
  background:linear-gradient(135deg,var(--v),var(--t));-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1}
.metric-label{font-size:9px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin-top:4px}

/* ── Dataset cards ── */
.dataset-card{display:flex;gap:12px;padding:12px 14px;border-radius:10px;background:var(--s3);
  border:1px solid var(--border);margin-bottom:8px;transition:border-color .2s}
.dataset-card:hover{border-color:rgba(124,111,255,.3)}
.ds-icon{font-size:20px;flex-shrink:0}
.ds-info{flex:1;min-width:0}
.ds-name{font-size:12px;font-weight:600;color:var(--text)}
.ds-meta{font-size:10px;color:var(--muted);margin-top:2px}
.ds-badge{font-size:10px;padding:3px 8px;border-radius:4px;font-weight:600;flex-shrink:0}

/* ── Chart container ── */
.chart-wrap{background:var(--s2);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px}

/* ── Control bar ── */
.control-bar{display:flex;align-items:center;gap:12px;padding:12px 32px;border-top:1px solid var(--border);
  flex-shrink:0;background:rgba(13,13,26,.7);backdrop-filter:blur(8px)}
.btn{padding:8px 18px;border-radius:8px;border:none;font-family:inherit;font-size:12px;font-weight:600;
  cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:linear-gradient(135deg,var(--v),#5e4fff);color:#fff;box-shadow:0 4px 16px rgba(124,111,255,.3)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 22px rgba(124,111,255,.4)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-ghost:hover{border-color:var(--v);color:var(--v)}
.btn-success{background:linear-gradient(135deg,#00c853,#1de9b6);color:#000;font-weight:700;
  box-shadow:0 4px 16px rgba(0,200,83,.3)}
.btn-danger{background:rgba(255,83,112,.15);border:1px solid rgba(255,83,112,.3);color:var(--r)}
.speed-label{font-size:10px;color:var(--muted);font-family:'JetBrains Mono'}
.speed-slider{width:100px;accent-color:var(--v)}

/* ── Status badge ── */
.status-pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:6px;
  font-size:10px;font-weight:700;letter-spacing:.5px}
.status-ok{background:rgba(105,240,174,.12);border:1px solid rgba(105,240,174,.25);color:var(--g)}
.status-warn{background:rgba(255,215,64,.12);border:1px solid rgba(255,215,64,.25);color:var(--o)}
.status-err{background:rgba(255,83,112,.12);border:1px solid rgba(255,83,112,.25);color:var(--r)}
.status-info{background:rgba(79,195,247,.12);border:1px solid rgba(79,195,247,.25);color:var(--t)}

/* ── Animations ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes typewriter{from{width:0}to{width:100%}}
.fade-in{animation:fadeUp .4s ease forwards}

/* ── Scrollbar ── */
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(124,111,255,.3);border-radius:4px}

/* ── Training table ── */
.train-table{width:100%;border-collapse:collapse;font-size:11px;font-family:'JetBrains Mono'}
.train-table th{text-align:left;padding:8px 10px;color:var(--muted);font-size:9px;letter-spacing:1px;
  text-transform:uppercase;border-bottom:1px solid var(--border)}
.train-table td{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.03)}
.train-table tr:last-child td{border-bottom:none}
.train-table .best{color:var(--g);font-weight:700}

/* ── Intro overlay ── */
#intro-overlay{position:fixed;inset:0;z-index:300;background:var(--bg);display:flex;align-items:center;
  justify-content:center;flex-direction:column;gap:16px;transition:opacity .6s ease}
#intro-overlay.hidden{opacity:0;pointer-events:none}
.intro-title{font-size:clamp(2.5rem,6vw,4.5rem);font-weight:900;letter-spacing:-2px;
  background:linear-gradient(135deg,#fff,rgba(255,255,255,.7));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.intro-sub{font-size:14px;color:var(--muted);letter-spacing:.5px}
.intro-badge{background:rgba(124,111,255,.15);border:1px solid rgba(124,111,255,.3);color:var(--v);
  padding:6px 16px;border-radius:100px;font-size:11px;font-weight:600}
</style>
</head>
<body>

<!-- Intro overlay -->
<div id="intro-overlay">
  <div class="intro-badge">🎬 Live System Demo</div>
  <div class="intro-title">Vis<span style="-webkit-text-fill-color:var(--v)">Curator</span></div>
  <div class="intro-sub">Autonomous Visual Dataset Curation via Foundation Models</div>
  <div style="margin-top:24px">
    <button class="btn btn-primary" onclick="startDemo()" style="font-size:14px;padding:12px 32px">
      ▶ Start Live Demo
    </button>
  </div>
  <div style="font-size:11px;color:var(--muted);margin-top:12px">
    ⚠️ Requires backend running on localhost:8000
  </div>
</div>

<div id="top-progress"></div>

<div class="container" style="display:none" id="main-ui">
  <!-- Header -->
  <div class="header">
    <div class="logo">
      <div class="logo-icon">VC</div>
      <div class="logo-text">Vis<span>Curator</span></div>
    </div>
    <div class="header-badge">
      <div class="pulse-dot" id="live-dot"></div>
      <span id="header-status">LIVE DEMO</span>
    </div>
  </div>

  <!-- Main -->
  <div class="main">
    <!-- Steps sidebar -->
    <div class="steps-panel">
      <div class="steps-title">Workflow Steps</div>
      <div id="steps-list"></div>
    </div>

    <!-- Content area -->
    <div class="content" id="content-area">
      <div style="text-align:center;padding:60px 20px;color:var(--muted)">
        <div style="font-size:40px;margin-bottom:12px">🚀</div>
        <div style="font-size:16px;font-weight:600;color:var(--text);margin-bottom:6px">Ready to Launch</div>
        <div style="font-size:13px">Click "Start Demo" to begin the automated workflow test</div>
      </div>
    </div>
  </div>

  <!-- Control bar -->
  <div class="control-bar">
    <button class="btn btn-primary" id="start-btn" onclick="startDemo()">▶ Run All Steps</button>
    <button class="btn btn-ghost" id="pause-btn" onclick="togglePause()" style="display:none">⏸ Pause</button>
    <button class="btn btn-ghost" onclick="skipToNext()">⏭ Skip</button>
    <div style="flex:1"></div>
    <span class="speed-label">Speed</span>
    <input type="range" min="1" max="5" value="2" class="speed-slider" id="speed-slider" oninput="updateSpeed()"/>
    <span class="speed-label" id="speed-val">1×</span>
    <div style="width:1px;height:20px;background:var(--border);margin:0 8px"></div>
    <span class="speed-label" id="elapsed-time">00:00</span>
  </div>
</div>

<script>
// ── Configuration ──
const API = 'http://127.0.0.1:8000';
let token = '';
let speedMultiplier = 1;
let paused = false;
let skipFlag = false;
let startTime = 0;
let elapsedInterval = null;

const STEPS = [
  { id:'health',   icon:'💓', name:'System Health Check',     desc:'Verify backend, NIM, packages' },
  { id:'login',    icon:'🔐', name:'Authentication',           desc:'JWT login with admin credentials' },
  { id:'loginFail',icon:'🚫', name:'Auth Rejection',           desc:'Test invalid password handling' },
  { id:'search',   icon:'🔍', name:'Dataset Search',           desc:'Query HuggingFace for datasets' },
  { id:'telemetry',icon:'📡', name:'System Telemetry',         desc:'CPU, RAM, GPU monitoring' },
  { id:'datasets', icon:'📦', name:'Curated Datasets',         desc:'List processed datasets' },
  { id:'inspect',  icon:'🔬', name:'Dataset Inspection',       desc:'Analyse image resolution & classes' },
  { id:'compile',  icon:'⚙️', name:'Model Compilation',        desc:'Graph → PyTorch code generation' },
  { id:'train',    icon:'🏋️', name:'Launch Training',           desc:'Start 3-epoch training run' },
  { id:'metrics',  icon:'📊', name:'Training Metrics',         desc:'Retrieve loss/accuracy curves' },
  { id:'library',  icon:'📚', name:'Library Overview',         desc:'All datasets + trained models' },
  { id:'summary',  icon:'✅', name:'Demo Complete',            desc:'Full workflow verified' },
];

// ── Build sidebar ──
function buildSteps() {
  const list = document.getElementById('steps-list');
  list.innerHTML = STEPS.map((s, i) => `
    <div class="step" id="step-${s.id}" onclick="jumpToStep(${i})">
      <div class="step-num" id="step-num-${s.id}">${s.icon}</div>
      <div class="step-info">
        <div class="step-name">${s.name}</div>
        <div class="step-desc">${s.desc}</div>
        <div class="step-time" id="step-time-${s.id}"></div>
      </div>
    </div>
  `).join('');
}
buildSteps();

// ── Utilities ──
function wait(ms) {
  const actual = ms / speedMultiplier;
  return new Promise(r => {
    const interval = setInterval(() => {
      if (skipFlag) { clearInterval(interval); skipFlag = false; r(); }
    }, 50);
    setTimeout(() => { clearInterval(interval); r(); }, actual);
  });
}

function updateSpeed() {
  const v = document.getElementById('speed-slider').value;
  speedMultiplier = [0.5, 1, 2, 3, 5][v - 1];
  document.getElementById('speed-val').textContent = speedMultiplier + '×';
}

function togglePause() {
  paused = !paused;
  document.getElementById('pause-btn').textContent = paused ? '▶ Resume' : '⏸ Pause';
}

function skipToNext() { skipFlag = true; }

function jumpToStep(i) { /* future: manual step navigation */ }

function setStepState(id, state) {
  const el = document.getElementById(`step-${id}`);
  el.className = `step ${state}`;
}

function setStepTime(id, ms) {
  document.getElementById(`step-time-${id}`).textContent = ms < 1000 ? `${ms}ms` : `${(ms/1000).toFixed(1)}s`;
}

function updateProgress(pct) {
  document.getElementById('top-progress').style.width = pct + '%';
}

function setContent(html) {
  const area = document.getElementById('content-area');
  area.innerHTML = html;
  area.scrollTop = 0;
}

function appendToTerminal(id, line) {
  const el = document.getElementById(id);
  if (!el) return;
  el.innerHTML += line + '\n';
  el.scrollTop = el.scrollHeight;
}

async function apiGet(url, auth = true) {
  const headers = auth && token ? { Authorization: `Bearer ${token}` } : {};
  const res = await fetch(url, { headers });
  return { status: res.status, data: await res.json(), time: 0 };
}

async function apiPost(url, body, auth = true, contentType = 'application/json') {
  const headers = { 'Content-Type': contentType };
  if (auth && token) headers.Authorization = `Bearer ${token}`;
  const bodyStr = contentType === 'application/json' ? JSON.stringify(body) : body;
  const res = await fetch(url, { method: 'POST', headers, body: bodyStr });
  return { status: res.status, data: await res.json().catch(() => ({})) };
}

function jsonHighlight(obj) {
  return JSON.stringify(obj, null, 2)
    .replace(/"([^"]+)":/g, '<span class="t-key">"$1"</span>:')
    .replace(/: "([^"]+)"/g, ': <span style="color:#c3e88d">"$1"</span>')
    .replace(/: (\d+\.?\d*)/g, ': <span style="color:#f78c6c">$1</span>')
    .replace(/: (true|false)/g, ': <span style="color:#82aaff">$1</span>')
    .replace(/: (null)/g, ': <span style="color:#546e7a">$1</span>');
}

// ── Elapsed timer ──
function startTimer() {
  startTime = Date.now();
  elapsedInterval = setInterval(() => {
    const s = Math.floor((Date.now() - startTime) / 1000);
    const m = Math.floor(s / 60);
    document.getElementById('elapsed-time').textContent =
      `${String(m).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
  }, 1000);
}

// ══════════════════════════════════════════════════════════════════
// ── DEMO STEPS ──
// ══════════════════════════════════════════════════════════════════

async function runStep_health() {
  setContent(`
    <div class="card glow-v fade-in">
      <div class="card-label">Step 1 · System Health Check</div>
      <div class="terminal" id="term-health"><span class="t-prompt">$</span> GET /api/health\n<span class="t-dim">Connecting to backend...</span>\n</div>
    </div>
    <div id="health-result"></div>
  `);
  await wait(600);

  const t0 = Date.now();
  try {
    const { data } = await apiGet(`${API}/api/health`, false);
    const ms = Date.now() - t0;
    setStepTime('health', ms);

    appendToTerminal('term-health', `<span class="t-ok">✓ Response: ${ms}ms</span>`);
    await wait(300);

    const pkgs = data.python_packages || {};
    const pkgLines = Object.entries(pkgs).map(([k, v]) =>
      `  ${v ? '<span class="t-ok">✓</span>' : '<span class="t-err">✗</span>'} ${k}`
    ).join('\n');

    appendToTerminal('term-health',
      `\n<span class="t-info">═══ Backend Status ═══</span>\n` +
      `  Backend: <span class="t-ok">${data.backend}</span>\n` +
      `  NIM:     <span class="${data.nim_connected ? 't-ok' : 't-err'}">${data.nim_connected ? 'connected' : 'offline'}</span>\n` +
      `  Model:   <span class="t-val">${data.nim_model || 'N/A'}</span>\n` +
      `\n<span class="t-info">═══ Packages ═══</span>\n${pkgLines}\n` +
      `\n<span class="t-info">═══ API Keys ═══</span>`
    );
    await wait(400);

    const envLines = Object.entries(data.env_vars || {}).map(([k, v]) =>
      `  ${v === 'set' || v.includes('set') ? '<span class="t-ok">✓</span>' : '<span class="t-err">✗</span>'} ${k}: ${v}`
    ).join('\n');
    appendToTerminal('term-health', envLines);

    await wait(400);
    document.getElementById('health-result').innerHTML = `
      <div class="metrics-row fade-in">
        <div class="metric-card"><div class="metric-val">${data.nim_connected ? 'ON' : 'OFF'}</div><div class="metric-label">NIM Status</div></div>
        <div class="metric-card"><div class="metric-val">${Object.values(pkgs).filter(Boolean).length}/${Object.keys(pkgs).length}</div><div class="metric-label">Packages</div></div>
        <div class="metric-card"><div class="metric-val">${Object.values(data.env_vars||{}).filter(v=>v.includes('set')).length}</div><div class="metric-label">API Keys</div></div>
        <div class="metric-card"><div class="metric-val">${data.active_jobs}</div><div class="metric-label">Active Jobs</div></div>
      </div>
    `;
  } catch (e) {
    appendToTerminal('term-health', `<span class="t-err">✗ Connection failed: ${e.message}</span>\n<span class="t-err">Make sure backend is running: python -m uvicorn backend.main:app</span>`);
    throw e;
  }
}

async function runStep_login() {
  setContent(`
    <div class="card glow-v fade-in">
      <div class="card-label">Step 2 · Authentication</div>
      <div class="terminal" id="term-login"><span class="t-prompt">$</span> POST /api/auth/login\n<span class="t-dim">Body: username=admin, password=viscurator</span>\n</div>
    </div>
    <div id="login-result"></div>
  `);
  await wait(500);

  const t0 = Date.now();
  const res = await fetch(`${API}/api/auth/login`, {
    method: 'POST',

let trainRunId = '';

async function runStep_train() {
  // Get the first available dataset
  const { data: datasets } = await apiGet(`${API}/api/dataset/list`);
  const dsList = Array.isArray(datasets) ? datasets : [];
  const ds = dsList[0];
  const dsPath = ds ? ds.path : '';

  const trainReq = {
    nodes: [
      {id:"input_1",type:"inputNode",data:{label:"Input",channels:3,height:224,width:224}},
      {id:"conv_1",type:"convNode",data:{label:"Conv2d",in_channels:3,out_channels:32,kernel_size:3}},
      {id:"relu_1",type:"activationNode",data:{label:"ReLU",activation:"relu"}},
      {id:"pool_1",type:"poolNode",data:{label:"MaxPool2d",kernel_size:2,stride:2}},
      {id:"flatten_1",type:"flattenNode",data:{label:"Flatten"}},
      {id:"fc_1",type:"linearNode",data:{label:"Linear",in_features:0,out_features:2}}
    ],
    edges: [
      {source:"input_1",target:"conv_1"},{source:"conv_1",target:"relu_1"},
      {source:"relu_1",target:"pool_1"},{source:"pool_1",target:"flatten_1"},
      {source:"flatten_1",target:"fc_1"}
    ],
    task_type: "custom_curated",
    dataset_path: dsPath,
    epochs: 3
  };

  setContent(`
    <div class="card glow-t fade-in">
      <div class="card-label">Step 9 · Launch Training</div>
      <div class="terminal" id="term-train"><span class="t-prompt">$</span> POST /api/builder/train\n<span class="t-dim">Task: custom_curated · Epochs: 3</span>\n<span class="t-dim">Dataset: ${ds?.name || 'N/A'}</span>\n<span class="t-dim">Launching training subprocess...</span>\n</div>
    </div>
    <div id="train-result"></div>
  `);
  await wait(600);

  const t0 = Date.now();
  const res = await apiPost(`${API}/api/builder/train`, trainReq);
  const ms = Date.now() - t0;
  setStepTime('train', ms);

  trainRunId = res.data.run_id || '';

  appendToTerminal('term-train',
    `<span class="t-ok">✓ HTTP 200 — ${ms}ms</span>\n` +
    `  Run ID: <span class="t-val">${trainRunId}</span>\n` +
    `  Status: <span class="t-info">${res.data.status}</span>\n` +
    `  Type:   <span class="t-val">${res.data.task_type}</span>\n\n` +
    `<span class="t-dim">Waiting for training to complete...</span>`
  );

  await wait(2000);

  // Poll for completion
  for (let i = 0; i < 20; i++) {
    await wait(2000);
    try {
      const { data: metricsData } = await apiGet(`${API}/api/builder/train/${trainRunId}/metrics`);
      const metrics = Array.isArray(metricsData) ? metricsData : [];
      if (metrics.length >= 4) { // initial + 3 epochs
        appendToTerminal('term-train', `<span class="t-ok">✓ Training completed — ${metrics.length - 1} epochs recorded</span>`);
        break;
      }
      appendToTerminal('term-train', `<span class="t-dim">  Epoch ${metrics.length - 1}/3 in progress...</span>`);
    } catch (e) {
      // continue polling
    }
  }
}

      <div style="font-size:12px;color:var(--muted);margin-top:8px">
        Sanjana R · AIE22149 · <span style="color:var(--v)">VisCurator v0.2</span>
      </div>
    </div>
  `);
}

// ══════════════════════════════════════════════════════════════════
// ── MAIN RUNNER ──
// ══════════════════════════════════════════════════════════════════

const stepFns = [
  runStep_health, runStep_login, runStep_loginFail, runStep_search,
  runStep_telemetry, runStep_datasets, runStep_inspect, runStep_compile,
  runStep_train, runStep_metrics, runStep_library, runStep_summary
];

async function startDemo() {
  document.getElementById('intro-overlay').classList.add('hidden');
  document.getElementById('main-ui').style.display = 'flex';
  document.getElementById('start-btn').disabled = true;
  document.getElementById('pause-btn').style.display = 'inline-flex';
  startTimer();

  for (let i = 0; i < STEPS.length; i++) {
    // Wait if paused
    while (paused) await wait(200);

    updateProgress(((i) / STEPS.length) * 100);
    setStepState(STEPS[i].id, 'running');

    // Scroll step into view
    document.getElementById(`step-${STEPS[i].id}`).scrollIntoView({ behavior: 'smooth', block: 'nearest' });

    try {
      await stepFns[i]();
      setStepState(STEPS[i].id, 'completed');
    } catch (e) {
      setStepState(STEPS[i].id, 'active');
      appendToTerminal(
        document.querySelector('.terminal')?.id || '',
        `<span class="t-err">Error: ${e.message}</span>`
      );
      // Continue to next step after error
    }

    await wait(800);
  }

  updateProgress(100);
  clearInterval(elapsedInterval);
  document.getElementById('start-btn').disabled = false;
  document.getElementById('start-btn').textContent = '↻ Run Again';
  document.getElementById('pause-btn').style.display = 'none';
  document.getElementById('header-status').textContent = 'DEMO COMPLETE ✓';
  document.getElementById('live-dot').style.background = 'var(--g)';
}

// Speed default
updateSpeed();
</script>
